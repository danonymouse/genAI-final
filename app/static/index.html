<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pragmatic Gap Detector</title>
<style>
  :root {
    --ink: #1d1d1b; --muted: #6b6a66; --line: #d6d4cc; --bg: #fbfaf7;
    --hl: #d7e6f7; --hl-on: #a9c9ee; --warn-bg: #fff7e6; --warn: #f0b429;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "PingFang SC", "Noto Sans SC", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  select, button { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: #fff; cursor: pointer; }
  button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  button:disabled { opacity: .5; cursor: default; }
  textarea { width: 100%; min-height: 150px; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; resize: vertical; }
  .meta { color: var(--muted); font-size: 13px; margin: 18px 0 8px; display: flex; gap: 12px; flex-wrap: wrap; }
  .badge { border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; }
  .warn { color: #8a5a00; }
  .line { padding: 14px 0; border-top: 1px solid #ecebe6; }
  .line:first-child { border-top: 0; }
  .lid { color: var(--muted); font-size: 13px; }
  .text { font-size: 20px; margin: 4px 0 6px; line-height: 1.9; }
  .span { background: var(--hl); border-radius: 6px; padding: 2px 6px; cursor: pointer; }
  .span.open { background: var(--hl-on); }
  .span.uncertain { background: var(--warn-bg); outline: 1px solid var(--warn); }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin: 8px 0; }
  .card.uncertain { background: var(--warn-bg); border-color: var(--warn); }
  .card h3 { margin: 0 0 6px; font-size: 16px; display: flex; gap: 14px; align-items: baseline; }
  .card h3 small { color: var(--muted); font-weight: normal; font-size: 13px; }
  .card p { margin: 2px 0; }
  .card .k { color: var(--muted); }
  .card .src { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .empty { color: var(--muted); }
  footer { margin-top: 28px; color: var(--muted); font-size: 13px; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>Pragmatic Gap Detector</h1>
  <p class="sub">Paste a Korean or Mandarin transcript. We highlight what a translation would hide, and explain it. Click a highlight to open or close its card.</p>

  <div class="panel">
    <div class="controls">
      <select id="lang"><option value="ko">Korean</option><option value="zh">Mandarin</option></select>
      <span id="examples"></span>
      <span style="flex:1"></span>
      <button id="go" class="primary">Analyze</button>
    </div>
    <textarea id="text" placeholder="One utterance per line"></textarea>
  </div>

  <div id="meta" class="meta"></div>
  <div id="out"></div>

  <footer>API docs at <a href="/docs">/docs</a>. Subtitle data from OPUS OpenSubtitles (<a href="https://www.opensubtitles.org">opensubtitles.org</a>).</footer>
</main>

<script>
const $ = (id) => document.getElementById(id);
const TYPE_LABEL = { slang: "slang", idiom: "idiom", discourse_marker: "discourse marker",
  register: "register", non_literal: "non-literal", wordplay: "wordplay" };
const SRC_LABEL = { live: "generated by Claude from the retrieved entries", cache: "pre-generated by Claude (cached)",
  lexicon: "taken directly from the lexicon entry (no LLM)" };

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

async function loadExamples() {
  const list = await (await fetch("/examples")).json();
  $("examples").innerHTML = list.map(e => `<button data-id="${esc(e.id)}">Load ${esc(e.id)}</button>`).join(" ");
  $("examples").querySelectorAll("button").forEach(b => b.onclick = async () => {
    const ex = await (await fetch(`/examples/${b.dataset.id}`)).json();
    $("lang").value = ex.lang; $("text").value = ex.text.trim();
  });
}

function renderLine(line) {
  let html = "", pos = 0;
  line.spans.forEach((s, i) => {
    html += esc(line.text.slice(pos, s.start));
    html += `<span class="span ${s.status === "uncertain" ? "uncertain" : ""}" data-i="${i}">${esc(line.text.slice(s.start, s.end))}</span>`;
    pos = s.end;
  });
  html += esc(line.text.slice(pos));

  const cards = line.spans.map((s, i) => {
    if (s.status === "uncertain") {
      return `<div class="card uncertain" data-card="${i}"><h3>${esc(s.surface)} · marked uncertain</h3>
              <p>${esc(s.uncertain_reason)}</p></div>`;
    }
    const e = s.explanation || {};
    return `<div class="card" data-card="${i}">
      <h3>${esc(s.surface)} <small>${esc(TYPE_LABEL[s.type] || s.type || "")}</small></h3>
      <p><span class="k">Literal:</span> ${esc(e.literal)}</p>
      <p><span class="k">What it does:</span> ${esc(e.function)}</p>
      <p><span class="k">Why translation misses it:</span> ${esc(e.why_mt_misses)}</p>
      <p><span class="k">Register:</span> ${esc(e.register)}</p>
      <p><span class="k">Textbook equivalent:</span> ${esc(e.textbook_equivalent)}</p>
      <div class="src">Explanation ${esc(SRC_LABEL[s.explanation_source] || "")}. Matched entry: ${esc(s.matches[0]?.headword)} (similarity ${s.matches[0]?.similarity})</div>
    </div>`;
  }).join("");

  const el = document.createElement("div");
  el.className = "line";
  el.innerHTML = `<div class="lid">line ${line.line_id + 1}</div><div class="text">${html}</div>
                  ${line.spans.length ? "" : '<div class="empty">Nothing flagged.</div>'}<div class="cards">${cards}</div>`;
  // cards start open; clicking a highlight toggles its card
  el.querySelectorAll(".span").forEach(sp => {
    sp.classList.add("open");
    sp.onclick = () => {
      const c = el.querySelector(`[data-card="${sp.dataset.i}"]`);
      const hide = c.style.display !== "none";
      c.style.display = hide ? "none" : "";
      sp.classList.toggle("open", !hide);
    };
  });
  return el;
}

async function analyze() {
  const text = $("text").value.trim();
  if (!text) return;
  $("go").disabled = true; $("go").textContent = "Analyzing…";
  try {
    const r = await fetch("/analyze", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ lang: $("lang").value, text }) });
    const data = await r.json();
    if (!r.ok) throw new Error(JSON.stringify(data.detail ?? data));
    const m = data.meta;
    $("meta").innerHTML = `<span class="badge">explanations: ${esc(m.mode)}${m.model ? " · " + esc(m.model) : ""}</span>
      <span class="badge">detector: ${esc(m.detector)}</span><span class="badge">retriever: ${esc(m.retriever)}</span>
      <span>${m.n_flagged} flagged · ${m.n_uncertain} uncertain</span>
      ${m.warnings.map(w => `<span class="warn">${esc(w)}</span>`).join("")}`;
    const out = $("out"); out.innerHTML = "";
    const panel = document.createElement("div"); panel.className = "panel";
    data.lines.forEach(l => panel.appendChild(renderLine(l)));
    out.appendChild(panel);
  } catch (e) {
    $("meta").innerHTML = `<span class="warn">Error: ${esc(e.message)}</span>`;
  } finally {
    $("go").disabled = false; $("go").textContent = "Analyze";
  }
}

$("go").onclick = analyze;
loadExamples();
</script>
</body>
</html>
